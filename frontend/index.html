<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcInk — Draw & Calculate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🖊️ CalcInk</h1>
    <p class="subtitle">Draw your math expression below</p>

    <!-- The drawing area -->
    <div class="canvas-wrapper">
      <canvas id="canvas" width="900" height="400"></canvas>
    </div>

    <!-- Buttons -->
    <div class="controls">
      <button id="clearBtn">🗑️ Clear</button>
    </div>

    <!-- Where the result shows up -->
    <div class="result-box" id="resultBox">
      <span id="answer">Loading model...</span>
      <canvas id="preview"></canvas>
    </div>

  </div>

  <script type="module" src="../backend/app.js"></script>
</body>
</html>
