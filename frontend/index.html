<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcInk — Draw & Calculate</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <h1>🖊️ CalcInk</h1>
    <p class="subtitle">Draw your math expression below</p>

    <div class="tool-bar">
      <button id="pencilBtn" class="tool-btn active" type="button" title="Pencil" aria-label="Pencil"
        aria-pressed="true">
        ✏️
      </button>

      <button id="eraserBtn" class="tool-btn" type="button" title="Eraser" aria-label="Eraser" aria-pressed="false">
        🧽
      </button>

      <select id="eraserMode" aria-label="Eraser mode" title="Eraser mode">
        <option value="stroke">Stroke</option>
        <option value="pixel">Pixel</option>
      </select>
    </div>

    <div class="drawing-area">
      <div class="size-control">
        <label for="sizeSlider">Size</label>

        <input id="sizeSlider" type="range" min="1" max="20" value="5" step="1">

        <output id="sizeValue" for="sizeSlider">5</output>
      </div>

      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="canvas" width="900" height="400" aria-label="Draw your math expression"></canvas>
        <output id="canvasAnswer" aria-label="Calculated answer" aria-live="polite" hidden></output>
      </div>
    </div>

    <!-- Buttons -->
    <div class="controls">
      <button id="undoBtn" type="button" aria-label="Undo last action"
        aria-keyshortcuts="Control+Z Meta+Z" title="Undo (Ctrl/Cmd+Z)" disabled>
        <span aria-hidden="true">↶</span> Undo
      </button>
      <button id="redoBtn" type="button" aria-label="Redo last action"
        aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"
        title="Redo (Ctrl/Cmd+Shift+Z; Ctrl+Y on Windows)" disabled>
        <span aria-hidden="true">↷</span> Redo
      </button>
      <button id="clearBtn" type="button" aria-label="Clear drawing" title="Clear drawing (undoable)">
        🗑️ Clear
      </button>
    </div>

    <!-- Where the result shows up -->
    <div class="result-box" id="resultBox">
      <span id="answer">Loading model...</span>
      <canvas id="preview"></canvas>
    </div>

    <section class="calculation-history" aria-labelledby="historyHeading">
      <div class="history-heading">
        <h2 id="historyHeading">Calculation history</h2>
        <span id="historyCount" aria-label="History entries out of 10">0 / 10</span>
      </div>
      <p class="history-note">Latest calculations, newest first · This session</p>
      <p id="historyEmpty">Your equations and answers will appear here.</p>
      <ol id="calculationHistory" aria-label="Previous calculations, newest first"></ol>
    </section>

  </div>

  <script>
    // Local files cannot load the app's module worker and model assets.
    if (location.protocol === "file:") {
      document.getElementById("answer").textContent =
        "Start CalcInk with npm run dev, then open http://localhost:5173/frontend/index.html";
    }
  </script>
  <script type="module" src="../backend/app.js"></script>
</body>

</html>
